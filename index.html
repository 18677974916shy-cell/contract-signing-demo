<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>合同签署交互原型｜PC 与移动端</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #eef1f6; color: #172033; font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    body { padding: 0 16px 24px; }
    .switch-header { position: sticky; z-index: 10; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; max-width: 1240px; min-height: 72px; margin: 0 auto; padding: 12px 0; background: rgba(238, 241, 246, .94); backdrop-filter: blur(12px); }
    .title-group h1 { margin: 0; font-size: 19px; font-weight: 600; }
    .title-group p { margin: 4px 0 0; color: #6a7588; font-size: 12px; }
    .device-switch { display: grid; grid-template-columns: 1fr 1fr; min-width: 224px; padding: 4px; border: 1px solid #d6dde8; border-radius: 12px; background: #ffffff; box-shadow: 0 5px 16px rgba(31, 45, 70, .07); }
    .device-switch button { min-height: 38px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; color: #637086; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
    .device-switch button[aria-pressed="true"] { background: #315bea; color: #ffffff; box-shadow: 0 4px 12px rgba(49, 91, 234, .22); }
    .stage { max-width: 1240px; margin: 0 auto; overflow: hidden; border: 1px solid #d7dee9; border-radius: 18px; background: #ffffff; box-shadow: 0 20px 54px rgba(31, 45, 70, .12); }
    iframe { display: block; width: 100%; border: 0; background: #ffffff; }
    iframe.pc { height: 940px; }
    iframe.mobile { height: 920px; background: #eef1f6; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 720px) {
      body { padding: 0 8px 16px; }
      .switch-header { align-items: stretch; flex-direction: column; gap: 10px; padding: 10px 2px; }
      .title-group { text-align: center; }
      .device-switch { width: 100%; }
      .stage { border-radius: 14px; }
      iframe.pc { height: 1050px; }
      iframe.mobile { height: 830px; }
    }
  </style>
</head>
<body>
  <header class="switch-header">
    <div class="title-group">
      <h1>合同签署交互原型</h1>
      <p>选择设备查看完整认证与签署流程</p>
    </div>
    <div class="device-switch" role="group" aria-label="切换设备版本">
      <button type="button" data-view="pc" aria-pressed="true">PC 端</button>
      <button type="button" data-view="mobile" aria-pressed="false">移动端</button>
    </div>
  </header>

  <main class="stage">
    <iframe id="prototype-frame" class="pc" title="PC 端合同签署交互原型" sandbox="allow-scripts allow-forms allow-modals"></iframe>
    <p class="sr-only" id="view-status" aria-live="polite">当前展示 PC 端</p>
  </main>

  <script>
    (() => {
      const pages = JSON.parse(document.getElementById('embedded-pages').textContent);
      const frame = document.getElementById('prototype-frame');
      const status = document.getElementById('view-status');
      const buttons = Array.from(document.querySelectorAll('[data-view]'));
      const decode = (encoded) => new TextDecoder().decode(Uint8Array.from(atob(encoded), (char) => char.charCodeAt(0)));

      function show(view) {
        frame.className = view;
        frame.title = view === 'pc' ? 'PC 端合同签署交互原型' : '移动端合同签署交互原型';
        frame.srcdoc = decode(pages[view]);
        buttons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
        status.textContent = view === 'pc' ? '当前展示 PC 端' : '当前展示移动端';
      }

      buttons.forEach((button) => button.addEventListener('click', () => show(button.dataset.view)));
      show('pc');
    })();
  </script>
</body>
</html>
